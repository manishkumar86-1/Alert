name: Scrum Master Job Alerts

permissions:
  contents: write

on:
  schedule:
    # Run every hour.
    # GitHub Actions uses UTC.
    - cron: "0 * * * *"

  # Allows you to run the job manually.
  workflow_dispatch:

# Prevent two executions from modifying seen.json
# at the same time.
concurrency:
  group: scrum-master-job-alerts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Scrum Master jobs
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

        run: |
          python check_jobs.py

      - name: Save job state
        run: |
          git config user.name "scrum-master-job-alert-bot"
          git config user.email "bot@example.com"

          git add seen.json

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update Scrum Master job state"
            git push
          fi
